<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sa bàn Trường Bưởi - Chu Văn An</title>
<link rel="stylesheet" href="css/style.css?v=1">
</head>
<body>
<div id="app">
  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <div id="topleft">
    <div id="title" class="card">
      <div class="tt">Trường Bưởi &mdash; Chu Văn An</div>
      <div class="tsub">Lớp nền và khu vực xung quanh</div>
      <span class="chip">BƯỚC 1 — NỀN XONG, NHÀ TRƯỜNG CHƯA CHI TIẾT</span>
    </div>
    <div id="lop" class="card"></div>
  </div>

  <div id="nav">
    <div id="compass" title="Quay về hướng bắc">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="19" fill="none" stroke="rgba(0,0,0,.1)"/>
        <g id="needle" style="transform-origin:26px 26px">
          <path d="M26 9 L31 27 L26 24 L21 27 Z" fill="#C0472F"/>
          <path d="M26 43 L21 25 L26 28 L31 25 Z" fill="#B8B1A0"/>
          <text x="26" y="8" text-anchor="middle" font-size="8.5" font-weight="700"
                fill="#4C4739">B</text>
        </g>
      </svg>
    </div>
    <div class="pill">
      <button id="bIn" title="Phóng to">+</button>
      <div class="sep"></div>
      <button id="bOut" title="Thu nhỏ">−</button>
    </div>
    <button id="bHome" title="Về góc nhìn gốc">⌂</button>
  </div>

  <div id="panel" class="card">
    <button id="px">×</button>
    <div id="pn"></div>
    <div id="py"></div>
    <div id="tabs">
      <button class="tab on" data-p="0">Giới thiệu</button>
      <button class="tab" data-p="1">Hình ảnh</button>
      <button class="tab" data-p="2">Bài viết</button>
    </div>
    <div class="pane on" id="pane0"><div id="pnote"></div></div>
    <div class="pane" id="pane1"></div>
    <div class="pane" id="pane2"></div>
  </div>

  <button id="tMo">▲ Dòng thời gian</button>
  <div id="time" class="card">
    <button id="tGon">▼ Thu gọn</button>
    <div id="marks"></div>
    <div id="row">
      <button id="bPlay" title="Chạy tự động">▶</button>
      <input type="range" id="yr" min="0" max="6" step="1" value="6">
      <div id="yl"></div>
    </div>
    <div id="evt"></div>
  </div>

  <div id="credit">Dữ liệu bản đồ · © OpenStreetMap contributors</div>
</div>

<script src="vendor/three.r128.min.js?v=1"></script>
<script src="js/dulieu.js?v=1"></script>
<script src="js/tainguyen.js?v=1"></script>
<script src="js/cauhinh.js?v=1"></script>
<script src="js/app.js?v=1"></script>
</body>
</html>
